ktor {
    environment = dev
    environment = ${?KTOR_ENV}

    deployment {
        port = 8080
        port = ${?PORT}
        database_url = "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false"
        database_url = ${?JDBC_DATABASE_URL}
        watch = [ AssBackend ]
    }
    security {
        session_sign_key = ${?SESSION_SIGN_KEY}
        cors_origins = "http://localhost:8080"
        cors_origins = ${?CORS_ORIGINS}
        registration_open = ${?REGISTRATION_OPEN}
    }
    performance {
        db_pool_size = 10
        db_pool_size = ${?DB_POOL_SIZE}
        flush_interval_ms = 200
        flush_interval_ms = ${?FLUSH_INTERVAL_MS}
        ingest_capacity = 500000
        ingest_capacity = ${?INGEST_CAPACITY}
        views_rate_limit = 600
        views_rate_limit = ${?VIEWS_RATE_LIMIT}
        stats_cache_ms = 5000
        stats_cache_ms = ${?STATS_CACHE_MS}
        retention_days = 90
        retention_days = ${?RETENTION_DAYS}
    }
    application {
        modules = [ com.ass.ApplicationKt.module ]
    }
}