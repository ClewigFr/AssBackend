plugins {
    id 'org.jetbrains.kotlin.jvm' version "$kotlin_version"
    id 'org.jetbrains.kotlin.plugin.serialization' version "$kotlin_version"
    id 'com.gradleup.shadow' version "$shadow_version"
    id 'application'
}

group = 'com.ass'
version = '0.0.1'

application {
    mainClass = 'io.ktor.server.netty.EngineMain'
}

kotlin {
    jvmToolchain(17)
}

sourceSets {
    main {
        kotlin.srcDirs = ['src']
        resources.srcDirs = ['resources']
    }
    test {
        kotlin.srcDirs = ['test']
        resources.srcDirs = ['testresources']
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("io.ktor:ktor-bom:$ktor_version")
    implementation 'io.ktor:ktor-server-core'
    implementation 'io.ktor:ktor-server-netty'
    implementation 'io.ktor:ktor-server-sessions'
    implementation 'io.ktor:ktor-server-cors'
    implementation 'io.ktor:ktor-server-status-pages'
    implementation 'io.ktor:ktor-server-content-negotiation'
    implementation 'io.ktor:ktor-serialization-kotlinx-json'
    implementation 'io.ktor:ktor-server-compression'
    implementation 'io.ktor:ktor-server-rate-limit'
    implementation 'io.ktor:ktor-server-forwarded-header'
    implementation "com.zaxxer:HikariCP:$hikari_version"
    implementation "ch.qos.logback:logback-classic:$logback_version"

    implementation "org.jetbrains.exposed:exposed-core:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-dao:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-jdbc:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-migration-jdbc:$exposed_version"
    implementation "com.h2database:h2:$h2_version"
    implementation "org.postgresql:postgresql:$postgresql_version"
    implementation "org.mindrot:jbcrypt:$jbcrypt_version"

    testImplementation platform("io.ktor:ktor-bom:$ktor_version")
    testImplementation 'io.ktor:ktor-server-test-host'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
}

shadowJar {
    // Ktor/Netty rely on ServiceLoader files, which must be merged in the fat jar
    mergeServiceFiles()
}

// Heroku runs `gradle stage` on deploy
tasks.register('stage') {
    dependsOn 'clean', 'shadowJar'
}
